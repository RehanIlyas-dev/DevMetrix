name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -s -o /dev/null -w "%{http_code}" https://devmetrix-api.onrender.com/
      - name: Ping dashboard
        run: curl -s -o /dev/null -w "%{http_code}" https://devmetrix-dashboard.onrender.com/
